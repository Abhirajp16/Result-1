<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · VTU Result Fetcher</title>
<style>
:root {
  --green-900: #06301F;
  --green-800: #0A4430;
  --green-700: #0E5A3C;
  --green-600: #12734C;
  --emerald:   #2ECC91;
  --mint-bg:   #E9F7F0;
  --mint-line: #C8E9DA;
  --ink:       #0B2C1E;
  --body:      #3D5548;
  --muted:     #7C8F85;
  --white:     #FFFFFF;
  --radius-xl: 34px;
  --shadow-card: 0 34px 70px -28px rgba(4,42,27,.55), 0 4px 18px -8px rgba(4,42,27,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: "Segoe UI Variable", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background: #0d5135;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ================= background ================= */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

/* campus photo, faint, behind everything */
.bg-photo {
  position: absolute; inset: 0;
  background: url("/static/campus.png") center / cover no-repeat;
  opacity: .22;
  filter: saturate(.75);
}
/* emerald gradient wash over the photo */
.bg-tint {
  position: absolute; inset: 0;
  background:
    radial-gradient(1100px 620px at 50% -12%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%),
    radial-gradient(760px 520px at 8% 6%, rgba(255,214,150,.34), rgba(255,214,150,0) 60%),
    radial-gradient(820px 620px at 96% 14%, rgba(46,204,145,.42), rgba(46,204,145,0) 62%),
    linear-gradient(135deg, #63D9A9 0%, #2FAE7E 32%, #14916A 58%, #0B6344 82%, #064029 100%);
}
/* soft glows */
.glow {
  position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none;
}
.glow.g1 { width: 520px; height: 520px; top: -170px; left: 26%; background: rgba(255,255,255,.5); }
.glow.g2 { width: 420px; height: 420px; bottom: -140px; left: -110px; background: rgba(46,204,145,.55); }
.glow.g3 { width: 380px; height: 380px; top: 8%; right: -120px; background: rgba(255,196,120,.30); }

/* orbit rings around the logo side */
.orbits { position: absolute; left: 8%; top: 46%; transform: translate(-50%,-50%); width: 660px; height: 660px; pointer-events: none; opacity: .38; }
.orbits span {
  position: absolute; inset: 0; border: 1.5px solid rgba(255,255,255,.55);
  border-radius: 50%; transform: rotate(-18deg) scaleY(.42);
}
.orbits span:nth-child(2) { inset: 78px; opacity: .7; transform: rotate(-18deg) scaleY(.46); }

/* dot grid, top-right */
.dots {
  position: absolute; top: 40px; right: 58px; width: 86px; height: 104px;
  background-image: radial-gradient(rgba(255,255,255,.75) 1.6px, transparent 1.7px);
  background-size: 21px 21px; opacity: .65;
}

/* curved waves at the bottom */
.waves { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 300px; }
.waves svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; display: block; }

/* ================= layout ================= */
.stage {
  position: relative; z-index: 2;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: minmax(0,1.06fr) minmax(0,.94fr);
  align-items: center;
  gap: clamp(24px, 4vw, 72px);
  padding: clamp(28px, 4vw, 56px) clamp(24px, 5vw, 88px);
}

/* ================= left · branding ================= */
.brand { text-align: center; padding: 8px 0; }

.emblem {
  position: relative;
  width: clamp(190px, 21vw, 300px);
  height: clamp(190px, 21vw, 300px);
  margin: 0 auto clamp(18px, 2.4vw, 34px);
}
.emblem::before {
  content: ""; position: absolute; inset: -14px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.78), rgba(255,255,255,.10) 68%, transparent 74%);
  filter: blur(6px);
}
.emblem img {
  position: relative; width: 100%; height: 100%;
  object-fit: contain;            /* aspect ratio preserved — never distorted */
  border-radius: 50%;
  border: 5px solid rgba(255,255,255,.92);
  box-shadow: 0 22px 46px -18px rgba(3,40,25,.62), 0 0 0 1px rgba(255,255,255,.5);
  background: #fff;
}

.brand h1 {
  margin: 0;
  font-size: clamp(30px, 3.6vw, 54px);
  font-weight: 800;
  letter-spacing: -.02em;
  color: #073B26;
  text-shadow: 0 2px 14px rgba(255,255,255,.45);
}
.tagline {
  margin: 6px 0 0;
  font-size: clamp(15px, 1.5vw, 22px);
  font-style: italic;
  font-weight: 600;
  color: #0A4A31;
}

.cap-row {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin: clamp(14px, 2vw, 26px) auto;
  max-width: 380px;
}
.cap-row::before, .cap-row::after {
  content: ""; flex: 1; height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(7,59,38,.55));
}
.cap-row::after { background: linear-gradient(90deg, rgba(7,59,38,.55), transparent); }
.cap-row svg { width: 34px; height: 34px; color: #0B2C1E; flex: 0 0 auto; }

.univ-pill {
  display: inline-flex; align-items: center; gap: 11px;
  padding: 13px 26px;
  border-radius: 999px;
  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.65);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  box-shadow: 0 14px 30px -16px rgba(3,40,25,.5);
  color: #083825;
  font-size: clamp(13px, 1.15vw, 17px);
  font-weight: 600;
  letter-spacing: .01em;
}
.univ-pill svg { width: 19px; height: 19px; color: var(--green-700); flex: 0 0 auto; }

/* ================= right · login card ================= */
.card-wrap { display: flex; justify-content: center; }

.card {
  position: relative;
  width: 100%;
  max-width: 520px;
  margin: 0;
  padding: 0 clamp(26px, 3vw, 46px) clamp(26px, 3vw, 38px);
  border-radius: var(--radius-xl);
  background: linear-gradient(160deg, rgba(255,255,255,.60), rgba(255,255,255,.34));
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.8);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
}

/* dark green header — sits flush INSIDE the top of the card */
.card-tab {
  display: flex; align-items: center; justify-content: center; gap: 11px;
  width: fit-content; max-width: 100%;
  margin: 0 auto clamp(26px, 2.6vw, 36px);
  padding: 17px clamp(22px, 3vw, 40px);
  border-radius: 0 0 26px 26px;
  background: linear-gradient(180deg, #0E5A3C 0%, #073D29 100%);
  color: #fff;
  font-size: clamp(14px, 1.2vw, 17px);
  font-weight: 700;
  letter-spacing: .085em;
  text-transform: uppercase;
  white-space: nowrap;
  box-shadow: 0 16px 34px -16px rgba(3,40,25,.75);
}
.card-tab svg { width: 21px; height: 21px; flex: 0 0 auto; }

.card h2 {
  margin: 6px 0 0;
  font-size: clamp(34px, 3.4vw, 46px);
  font-weight: 800;
  letter-spacing: -.02em;
  color: #073B26;
}
.card-sub {
  margin: 12px 0 0;
  font-size: clamp(14px, 1.2vw, 17px);
  color: var(--body);
}
.rule {
  width: 74px; height: 3px; margin: 16px 0 30px;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--emerald), rgba(46,204,145,0));
}

/* ---------- fields ---------- */
.field { position: relative; margin-bottom: 18px; }
.field .ico {
  position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
  width: 21px; height: 21px; color: var(--green-700);
  pointer-events: none; opacity: .9;
}
.field input {
  width: 100%; height: 60px;
  padding: 0 54px 0 58px;
  border-radius: 999px;
  border: 1.5px solid rgba(255,255,255,.9);
  background: rgba(255,255,255,.95);
  font: inherit; font-size: 16px; color: var(--ink);
  outline: none;
  box-shadow: 0 8px 20px -12px rgba(3,40,25,.4);
  transition: border-color .2s, box-shadow .2s, background .2s, transform .2s;
}
.field input::placeholder { color: var(--muted); }
.field input:hover { background: #fff; }
.field input:focus {
  background: #fff;
  border-color: var(--emerald);
  box-shadow: 0 0 0 4px rgba(46,204,145,.22), 0 10px 24px -14px rgba(3,40,25,.5);
  transform: translateY(-1px);
}
.field.invalid input { border-color: #E5484D; box-shadow: 0 0 0 4px rgba(229,72,77,.18); }

.eye {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  width: 36px; height: 36px; border: 0; background: transparent; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--green-700); border-radius: 50%; padding: 0;
  transition: background .18s, color .18s;
}
.eye:hover { background: rgba(46,204,145,.18); }
.eye svg { width: 21px; height: 21px; }

/* ---------- error ---------- */
.err {
  display: none;
  margin: 0 0 18px;
  padding: 12px 17px;
  border-radius: 14px;
  background: rgba(229,72,77,.13);
  border: 1px solid rgba(229,72,77,.4);
  color: #B3261E;
  font-size: 13.5px; font-weight: 650;
}
.err.show { display: block; animation: shake .3s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

/* ---------- button ---------- */
.btn-login {
  position: relative;
  width: 100%; height: 62px; margin-top: 8px;
  border: 0; border-radius: 999px;
  background: linear-gradient(180deg, #14724B 0%, #0A4A31 48%, #052A1C 100%);
  color: #fff; font: inherit; font-size: 17px; font-weight: 700;
  letter-spacing: .015em;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  box-shadow: 0 18px 34px -14px rgba(3,40,25,.8), inset 0 1px 0 rgba(255,255,255,.2);
  transition: transform .16s, box-shadow .16s, filter .16s;
  overflow: hidden;
}
.btn-login::after {
  content: ""; position: absolute; top: 0; left: -60%;
  width: 45%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent);
  transform: skewX(-18deg);
  transition: left .5s ease;
}
.btn-login:hover { filter: brightness(1.13); transform: translateY(-2px); box-shadow: 0 24px 42px -16px rgba(3,40,25,.85); }
.btn-login:hover::after { left: 120%; }
.btn-login:active { transform: translateY(1px); }
.btn-login:disabled { opacity: .82; cursor: not-allowed; transform: none; }
.btn-login svg { width: 21px; height: 21px; flex: 0 0 auto; }

.spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  animation: spin .7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-login.loading .spinner { display: block; }
.btn-login.loading .btn-ico { display: none; }

/* ---------- authorized divider ---------- */
.auth-note {
  display: flex; align-items: center; gap: 16px;
  margin: 26px 0 20px;
  font-size: 13.5px; font-weight: 600; color: var(--body);
}
.auth-note::before, .auth-note::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(11,44,30,.3));
}
.auth-note::after { background: linear-gradient(90deg, rgba(11,44,30,.3), transparent); }

/* ---------- footer pill ---------- */
.foot {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 13px 18px;
  border-radius: 999px;
  background: var(--mint-bg);
  border: 1px solid var(--mint-line);
  color: var(--green-700);
  font-size: 13.5px; font-weight: 600;
}
.foot .ico-dot {
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--green-700); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; font-style: italic;
  font-family: Georgia, serif;
  flex: 0 0 auto;
}

/* ================= responsive ================= */
@media (max-width: 1080px) {
  .stage { gap: 26px; padding: 32px 34px; }
  .card { max-width: 470px; }
  .dots { right: 26px; top: 24px; }
}
@media (max-width: 900px) {
  .stage {
    grid-template-columns: 1fr;
    justify-items: center;
    padding: 34px 22px 46px;
    gap: 30px;
  }
  .brand { max-width: 560px; }
  .emblem { width: clamp(150px, 34vw, 210px); height: clamp(150px, 34vw, 210px); }
  .brand h1 { font-size: clamp(27px, 6.4vw, 38px); }
  .tagline { font-size: clamp(14px, 3.2vw, 18px); }
  .card { max-width: 480px; }
  .orbits { left: 50%; top: 22%; width: 460px; height: 460px; }
  .waves { height: 220px; }
}
@media (max-width: 520px) {
  .stage { padding: 24px 16px 40px; }
  .card { padding: 0 20px 26px; border-radius: 26px; }
  .card-tab { padding: 13px 24px; font-size: 13px; letter-spacing: .06em; }
  .field input { height: 55px; font-size: 15px; padding: 0 48px 0 52px; }
  .field .ico { left: 20px; }
  .btn-login { height: 56px; font-size: 16px; }
  .univ-pill { padding: 11px 18px; font-size: 12.5px; }
  .foot { font-size: 12.5px; padding: 11px 14px; }
  .dots { display: none; }
}
@media (max-height: 760px) and (min-width: 901px) {
  .stage { padding-top: 24px; padding-bottom: 24px; }
  .emblem { width: clamp(150px, 17vw, 230px); height: clamp(150px, 17vw, 230px); }
  .card { padding-bottom: 26px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-photo"></div>
  <div class="bg-tint"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="glow g3"></div>
  <div class="orbits"><span></span><span></span></div>
  <div class="dots"></div>
  <div class="waves">
    <svg viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <path fill="rgba(255,255,255,.42)" d="M0,196 C240,258 420,120 700,150 C960,178 1140,266 1440,214 L1440,300 L0,300 Z"></path>
      <path fill="rgba(6,55,37,.55)" d="M0,246 C260,296 460,196 760,222 C1040,246 1220,300 1440,266 L1440,300 L0,300 Z"></path>
      <path fill="rgba(4,42,27,.72)" d="M0,278 C300,312 520,244 820,264 C1080,281 1260,308 1440,292 L1440,300 L0,300 Z"></path>
    </svg>
  </div>
</div>

<main class="stage">

  <!-- ============ left · university branding ============ -->
  <section class="brand">
    <div class="emblem">
      <img src="/static/vtu_logo.png" alt="Visvesvaraya Technological University emblem">
    </div>

    <h1>VTU Result Fetcher</h1>
    <p class="tagline">Get Your Results &bull; Analyze &bull; Explore</p>

    <div class="cap-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>

    <div class="univ-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>
      </svg>
      Visvesvaraya Technological University
    </div>
  </section>

  <!-- ============ right · login card ============ -->
  <section class="card-wrap">
    <form class="card" method="post" action="/login" autocomplete="off" novalidate>
      <div class="card-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 10v6"/><path d="M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        VTU Result Fetcher
      </div>

      <h2>Log In</h2>
      <p class="card-sub">Access your VTU results and more.</p>
      <div class="rule"></div>

      <div class="err{% if error %} show{% endif %}" id="err">{% if error %}{{ error }}{% endif %}</div>

      <div class="field" id="f-username">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" name="username" placeholder="Username" required autofocus>
      </div>

      <div class="field" id="f-password">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Password" required>
        <button type="button" class="eye" id="eye" aria-label="Show password" tabindex="0">
          <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <path d="M9.9 9.9a3 3 0 1 1 4.2 4.2"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span class="spinner" aria-hidden="true"></span>
        <svg class="btn-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span class="btn-label">Log In</span>
      </button>

      <div class="auth-note">Only for Authorized Users</div>

      <div class="foot">
        <span class="ico-dot">i</span>
        Powered by VTU &nbsp;&bull;&nbsp; For Better Access
      </div>
    </form>
  </section>

</main>

<script>
(function () {
  "use strict";

  /* ---- password visibility toggle ---- */
  var eye = document.getElementById("eye");
  var pw  = document.getElementById("password");
  eye.addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    document.getElementById("eye-open").style.display = show ? "none" : "";
    document.getElementById("eye-shut").style.display  = show ? "" : "none";
    eye.setAttribute("aria-label", show ? "Hide password" : "Show password");
    pw.focus();
  });

  /* ---- clear the error banner as soon as the user types ---- */
  var errBox = document.getElementById("err");
  ["username", "password"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", function () {
      if (errBox.classList.contains("show")) {
        errBox.classList.remove("show");
        errBox.textContent = "";
      }
    });
  });

  /* ---- submit: validate, then show the loading animation ---- */
  var form  = document.querySelector("form.card");
  var btn   = document.getElementById("submitBtn");
  var label = btn.querySelector(".btn-label");
  var fUser = document.getElementById("f-username");
  var fPass = document.getElementById("f-password");

  function invalid(field) {
    field.classList.add("invalid");
    setTimeout(function () { field.classList.remove("invalid"); }, 1600);
  }

  form.addEventListener("submit", function (e) {
    var u = document.getElementById("username").value.trim();
    var p = pw.value;

    if (!u) { e.preventDefault(); invalid(fUser); document.getElementById("username").focus(); return; }
    if (!p) { e.preventDefault(); invalid(fPass); pw.focus(); return; }

    /* let the request go through, with a visible loading state */
    btn.disabled = true;
    btn.classList.add("loading");
    label.textContent = "Signing in…";
  });

  /* Enter key submits natively (button is type="submit" inside the form);
     this guard just blocks accidental double-submits. */
  form.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && btn.disabled) e.preventDefault();
  });
})();
</script>

</body>
</html>
