<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Analytics - VTU Result Fetcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;}
.topbar{background:linear-gradient(135deg,#059669 0%,#065F46 100%);padding:18px 28px;display:flex;align-items:center;gap:14px;}
.topbar h1{color:#fff;font-size:1.1rem;font-weight:800;flex:1;}
.topbar a{color:#A7F3D0;text-decoration:none;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 14px;}
.topbar a:hover{color:#fff;}
.container{max-width:1060px;margin:0 auto;padding:20px 22px 40px;}
.loading{text-align:center;padding:60px;color:#6B7280;}
.spin{display:inline-block;width:32px;height:32px;border:3px solid #E5E7EB;border-top-color:#059669;border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px;}
@keyframes sp{to{transform:rotate(360deg);}}
.err{text-align:center;padding:40px;color:#DC2626;font-weight:600;}
.hdr{background:linear-gradient(135deg,#1C7A5E,#123D2E);border-radius:14px;padding:26px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;box-shadow:0 4px 18px rgba(5,150,105,.25);}
.hdr h2{font-size:1.4rem;font-weight:800;font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em;}
.hdr .sub{font-size:.82rem;opacity:.8;margin-top:3px;}
.hdr .pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 16px;font-weight:700;font-size:.9rem;}
.hdr .info{font-size:.78rem;opacity:.8;margin-top:5px;text-align:right;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.stat{background:#fff;border-radius:11px;padding:14px;text-align:center;border:1px solid #E5E7EB;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.stat-l{font-size:10px;color:#6B7280;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
.stat-v{font-size:22px;font-weight:800;margin-top:3px;}
.stat-v.g{color:#059669;}.stat-v.r{color:#DC2626;}.stat-v.b{color:#2563EB;}.stat-v.p{color:#7C3AED;}
.tw{background:#fff;border-radius:14px;border:1px solid #E5E7EB;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:linear-gradient(135deg,#1C7A5E,#059669);color:#fff;padding:11px 13px;text-align:left;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;z-index:1;}
th:first-child{text-align:center;width:48px;}
td{padding:9px 13px;border-bottom:1px solid #F3F4F6;}
tr:last-child td{border-bottom:none;}
tr:hover{background:#F0FDF4;}
.rc{text-align:center;font-weight:800;font-size:14px;}
.mn{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-weight:600;font-size:12px;color:#1F2937;}
.mc{text-align:center;font-weight:800;font-size:14px;}
.gp{display:inline-block;padding:3px 9px;border-radius:6px;font-weight:700;font-size:11px;}
.sp{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;}
@media(max-width:700px){.hdr{padding:18px;flex-direction:column;text-align:center;}.stats{grid-template-columns:repeat(2,1fr);}.container{padding:12px;}table{display:block;overflow-x:auto;}}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" id="backBtn">&#8592; Back to Dashboard</a>
  <h1>Subject Analytics</h1>
</div>
<div class="container" id="out">
  <div class="loading"><div class="spin"></div><div>Loading...</div></div>
</div>
<script>
var $=function(id){return document.getElementById(id);};

function gradeOf(m){if(m==null)return"\u2026";var n=Number(m);if(n>=90)return"O";if(n>=80)return"A+";if(n>=70)return"A";if(n>=60)return"B+";if(n>=55)return"B";if(n>=50)return"C";if(n>=40)return"P";return"F";}
function gC(g){return g==="F"?"#DC2626":g==="O"||g==="A+"?"#059669":g==="A"||g==="B+"?"#2563EB":g==="B"||g==="C"?"#F59E0B":"#6B7280";}
function gB(g){return g==="F"?"#FEE2E2":g==="O"||g==="A+"?"#D1FAE5":g==="A"||g==="B+"?"#DBEAFE":g==="B"||g==="C"?"#FEF3C7":"#F3F4F6";}

var p=new URLSearchParams(window.location.search);
var bid=p.get("batch_id");
var subj=p.get("subject");
document.getElementById("backBtn").href="/?tab=analytics&batch_id="+encodeURIComponent(bid);

if(!bid||!subj){
  $("out").innerHTML='<div class="err">Missing parameters. Go back and try again.</div>';
}else{
  fetch("/api/subject-analytics?batch_id="+encodeURIComponent(bid)+"&subject="+encodeURIComponent(subj))
    .then(function(r){if(!r.ok)throw new Error("Load failed");return r.json();})
    .then(function(d){if(d.error)throw new Error(d.error);render(d);})
    .catch(function(e){$("out").innerHTML='<div class="err">'+e.message+'</div>';});
}

function render(d){
  var batch=d.batch;
  var code=d.subject_code;
  var list=d.students||[];
  if(!list.length){$("out").innerHTML='<div class="err">No data for '+code+'</div>';return;}

  var processed=[];
  list.forEach(function(st){
    var sub=st.subject;
    var isRv=sub.is_revaluated===true;
    var bestTotal=isRv&&sub.final_total!=null?sub.final_total:sub.total;
    var bestResult=isRv&&sub.final_result?sub.final_result:(sub.result||"");
    var bestGrade=isRv&&sub.final_grade?sub.final_grade:(sub.grade||gradeOf(bestTotal));
    var pass=bestResult!=="F";
    processed.push({usn:st.usn,name:st.name,internal:sub.internal,external:sub.external,total:bestTotal,grade:bestGrade,pass:pass,isRv:isRv,origExt:sub.original_external,origTotal:sub.original_total});
  });

  processed.sort(function(a,b){return (b.total||0)-(a.total||0);});

  var hi=processed[0].total, lo=processed[processed.length-1].total;
  var sum=0;for(var i=0;i<processed.length;i++)sum+=(processed[i].total||0);
  var avg=(sum/processed.length).toFixed(1);
  var passCount=0,failCount=0;
  for(var i=0;i<processed.length;i++){if(processed[i].pass)passCount++;else failCount++;}

  var h='';
  h+='<div class="hdr"><div><h2>'+code+'</h2><div class="sub">Subject-wise marks analysis &mdash; all students ranked</div></div>';
  h+='<div style="text-align:right;"><div class="pill">'+processed.length+' students</div>';
  if(batch)h+='<div class="info">'+(batch.department||"")+' &middot; Sem '+(batch.semester||"")+' &middot; '+(batch.scheme||"")+'</div>';
  h+='</div></div>';

  h+='<div class="stats">';
  h+='<div class="stat"><div class="stat-l">Highest</div><div class="stat-v g">'+hi+'</div></div>';
  h+='<div class="stat"><div class="stat-l">Lowest</div><div class="stat-v r">'+lo+'</div></div>';
  h+='<div class="stat"><div class="stat-l">Average</div><div class="stat-v b">'+avg+'</div></div>';
  h+='<div class="stat"><div class="stat-l">Pass / Fail</div><div class="stat-v p">'+passCount+' / '+failCount+'</div></div>';
  h+='</div>';

  h+='<div class="tw"><table><thead><tr>';
  h+='<th>Rank</th><th>USN</th><th>Name</th><th style="text-align:center">Internal</th><th style="text-align:center">External</th><th style="text-align:center">Total</th><th style="text-align:center">Grade</th><th style="text-align:center">Status</th>';
  h+='</tr></thead><tbody>';

  var rc=0;
  for(var i=0;i<processed.length;i++){
    var st=processed[i];
    var fail=!st.pass;
    var bg=i%2===0?"#fff":"#F9FAFB";
    var medal="\u2014";
    if(fail){bg="#FFF5F5";}
    else{rc++;medal=rc;if(rc===1){medal="\uD83E\uDD47";bg="#ECFDF5";}else if(rc===2){medal="\uD83E\uDD48";}else if(rc===3){medal="\uD83E\uDD49";}}
    var gc=gC(st.grade);
    var ok=st.pass;
    h+='<tr style="background:'+bg+'">';
    h+='<td class="rc" style="color:'+(rc<=3?(rc===1?"#059669":rc===2?"#6B7280":"#D97706"):"#6B7280")+'">'+medal+'</td>';
    h+='<td class="mn">'+st.usn+'</td>';
    h+='<td style="color:#374151">'+(st.name||"\u2014")+'</td>';
    h+='<td class="mc" style="color:#6366F1">'+st.internal+'</td>';
    var extDisplay=st.isRv&&st.origExt!=null?st.origExt+' &rarr; '+st.external:st.external;
    h+='<td class="mc" style="color:#6366F1">'+extDisplay+(st.isRv?' <span style="background:#059669;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;vertical-align:middle;">RV</span>':"")+'</td>';
    var totDisplay=st.isRv&&st.origTotal!=null?st.origTotal+' &rarr; '+st.total:st.total;
    h+='<td class="mc" style="color:'+gc+'">'+totDisplay+'</td>';
    h+='<td style="text-align:center"><span class="gp" style="background:'+gB(st.grade)+';color:'+gc+'">'+(st.grade||"\u2014")+'</span></td>';
    h+='<td style="text-align:center"><span class="sp" style="background:'+(ok?"#D1FAE5;color:#065F46":"#FEE2E2;color:#991B1B")+'">'+(ok?"PASS":"FAIL")+'</span></td>';
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  $("out").innerHTML=h;
}
</script>
</body>
</html>
